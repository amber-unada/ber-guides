    div {

    fieldset {

        background: rgba(255, 255, 255, 0.1);

    legend {
        margin: 0 auto;

        width: 90%;
        margin: 6px auto 14px auto;

    }

    textarea {
        display: block;
        margin: 0 auto;
        width: 100%;
        max-width: 300px;
        height: 60px;

        padding: 8px 12px;
        border-radius: 8px;
        resize: vertical;
    }

    select#subject {
        display: block;
        margin: 0 auto 15px auto; 
        width: 100%;
        max-width: 200px;       
        padding: 6px 10px; 
        font-size: 0.9rem;
        border-radius: 6px;
        box-sizing: border-box;

    label[for="email"],

        text-align: center;
